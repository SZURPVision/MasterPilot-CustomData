syntax = "proto3";

option csharp_namespace = "MasterPilot.Communicator.ProtoMessages.Enginner";

// 系统控制流程状态
enum AutoCtrlProcess {
  PROCESS_NONE = 0;
  PROCESS_RETURN_ORIGIN = 1;
  PROCESS_CLIMBING = 2;
  PROCESS_DOWN_STAIR = 3;
  PROCESS_ENERGY_UNIT = 4;
  PROCESS_EXCHANGE_ORE = 5;
  PROCESS_STORE_ORE = 6;
  PROCESS_GROUND_ORE = 7;
}

// 控制模式
enum CtrlMode {
  CTRL_NONE = 0;
  CTRL_RC = 1;
  CTRL_KEYBOARD = 2;
  CTRL_CONTROLLER = 3;
}

// 机器人移动模式
enum MoveMode {
  MOVE_NONE = 0;
  MOVE_NORMAL = 1;
  MOVE_CLIMBING = 2;
  MOVE_DOWNSTAIR = 3;
}

// 底盘实时数据
message ChassisState {
  float speed_x = 1;    // X轴速度
  float speed_y = 2;    // Y轴速度
  float speed_w = 3;    // 角速度
  float hip_length = 4; // 后腿腿长 (L_Length)
  bool crawler_on = 5;  // 履带是否开启
  float roll_angle = 6; // 整车Roll轴角度
  float accel_y = 7;    // Y轴加速度
}

// 机械臂实时数据
message ArmState {
  float angle_yaw = 1;       // 机械臂Yaw
  float angle_pitch1 = 2;    // 关节1 Pitch
  float angle_pitch2 = 3;    // 关节2 Pitch
  float angle_pitch3 = 4;    // 关节3 Pitch
  float angle_roll = 5;      // 机械臂Roll
  float angle_end_pitch = 6; // 末端Pitch
  float angle_end_roll = 7;  // 末端Roll
  float length_grip = 8;     // 夹爪开合距离
  bool grip_close = 9;       // 夹爪闭合标志位
}

// 云台/视觉相关状态
message GimbalVisionState {
  float visual_yaw_offset = 1; // 视觉补偿Yaw (angle_visualyaw)
  bool is_found_target = 2;    // 是否发现目标 (矿仓等)
  float target_atti_yaw = 3;   // 目标姿态Yaw
  float target_atti_pitch = 4; // 目标姿态Pitch
  float target_atti_roll = 5;  // 目标姿态Roll
  float target_posit_x = 6;    // 目标相对坐标X
  float target_posit_y = 7;    // 目标相对坐标Y
  float target_posit_z = 8;    // 目标相对坐标Z
}

// 机器人全局标志位与裁判系统数据
message RobotStatus {
  bool p3_lock = 1;                  // P3锁定标志
  bool robot_init_ok = 2;            // 初始化完成
  bool controlled_by_controller = 3; // 受控模式
  bool radar_warning = 4;            // 飞镖/雷达预警 (if_dart_comming)
  uint32 robot_id = 5;               // 机器人ID
  uint32 robot_camp = 6;             // 机器人阵营
}

// 发送给自定义客户端的大包
message EngineerDataPacketToClient {
  optional AutoCtrlProcess current_process = 2;
  optional CtrlMode ctrl_mode = 3;
  optional MoveMode move_mode = 4;

  optional ChassisState chassis = 5;
  optional ArmState arm = 6;
  optional GimbalVisionState vision = 7;
  optional RobotStatus status = 8;
}
